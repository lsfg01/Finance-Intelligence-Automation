<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Análisis de cartera — laboratorio</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#122032;background:#f6f8fa}
    *{box-sizing:border-box} body{margin:0} header{background:#172d44;color:#fff;padding:22px max(22px,calc((100% - 1050px)/2))}
    main{max-width:1050px;margin:24px auto;padding:0 20px} h1{margin:0;font-size:1.6rem} h2{font-size:1.12rem;margin:0 0 14px}
    .sub{color:#ccd9e3;margin-top:6px} .alert{padding:13px 18px;border:1px solid #d9a637;background:#fff6df;border-radius:10px;margin-bottom:20px}
    .cards{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}.card{background:white;border:1px solid #dbe3ea;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 6px #172d4408}
    table{width:100%;border-collapse:collapse;font-size:.91rem} td,th{padding:9px 6px;border-bottom:1px solid #e5ebf0;text-align:left} th{color:#617084;font-weight:600}
    .pill{display:inline-block;padding:4px 8px;border-radius:15px;background:#e6f0ff;color:#1457a1;font-weight:600;font-size:.78rem}
    .muted{color:#667b8c}.small{font-size:.82rem} button{background:#215caa;color:white;padding:12px 16px;border:0;border-radius:9px;font-weight:650;cursor:pointer}
    button:disabled{background:#879bad;cursor:default}.stat{font-size:1.6rem;font-weight:720;margin:7px 0} .pair{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    code{background:#eef2f6;padding:2px 4px;border-radius:3px;word-break:break-all} ul{padding-left:20px} li{margin:7px 0}
    .table-scroll{overflow-x:auto}
    input,select{font:inherit;max-width:100%;padding:7px;border:1px solid #aab9c8;border-radius:5px}
    .holdings-controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:12px 0}
    .holdings-controls label{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;min-width:0;max-width:100%}
    input[type=file]{width:min(100%,350px)}
    .secondary{background:white;color:#215caa;border:1px solid #afc5dc}
    .secondary:disabled{color:#607485;background:#e9eef2}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:16px 0}
    .metrics div{background:#f6f8fa;padding:12px;border-radius:8px}
    .metrics dt{color:#506577;font-size:.86rem}
    .metrics dd{font-size:1.16rem;font-weight:650;margin:6px 0 0}
    dialog{width:min(850px,calc(100% - 24px));max-height:calc(100dvh - 24px);border:1px solid #dbe3ea;border-radius:12px;padding:20px;color:inherit}
    dialog::backdrop{background:#172d4488}
    .dialog-actions{position:sticky;bottom:-20px;background:#fff;border-top:1px solid #dbe3ea;margin:12px -20px -20px;padding:12px 20px}
    .table-scroll table{min-width:660px}
    summary{cursor:pointer;color:#215caa}
    :focus-visible{outline:2px solid #215caa;outline-offset:3px}
    [hidden]{display:none!important}
    @media(max-width:750px){.cards{grid-template-columns:1fr}header{padding:22px}}
  </style>
</head>
<body>
<header><h1>Laboratorio de análisis de inversiones</h1></header>
<main>
  <div class="alert"><strong>SIMULACIÓN.</strong> Las posiciones y noticias son ficticias. La tabla identifica el origen y la fecha de cada precio.</div>
  <section class="card" aria-labelledby="valuation-title">
    <h2 id="valuation-title">Cartera</h2>
    <div class="holdings-controls">
      <label>Cartera activa <select id="portfolio-select" disabled></select></label>
    </div>
    <p id="versions" class="muted"></p>
    <p id="valuation-status" class="muted" role="status">Cargando cartera…</p>
    <div class="holdings-controls">
      <button id="run" hidden>Analizar cartera</button>
      <button id="refresh-prices" class="secondary" hidden>Actualizar precios</button>
      <button id="open-import">Importar cartera</button>
      <button id="show-imported" class="secondary" hidden>Ver valoración del CSV</button>
    </div>
    <p id="status" role="status" class="muted" hidden></p>
    <p id="report-link" hidden><a href="#report-panel">Ver informe guardado</a></p>
    <p id="refresh-status" class="muted" role="status" hidden></p>
    <div id="valuation-metrics"></div>
    <div id="valuation" class="table-scroll" tabindex="0" role="region" aria-label="Posiciones"></div>
  </section>
  <dialog id="import-dialog" aria-labelledby="import-title">
    <h2 id="import-title">Importar cartera</h2>
    <fieldset class="holdings-controls">
      <legend>Origen</legend>
      <label><span><input name="import-source" type="radio" checked autofocus> Desde archivo</span></label>
      <label><span><input name="import-source" type="radio" id="account-source"> Conectar cuenta</span></label>
    </fieldset>
    <form id="import-holdings">
      <div class="holdings-controls">
        <label>Cuenta de Investing.com <input id="investing-account" required maxlength="100" placeholder="Nombre de la cartera ficticia"></label>
        <label>CSV de Investing.com Holdings <input id="investing-file" type="file" accept=".csv,text/csv" required></label>
        <button id="preview-investing" class="secondary" type="submit">Vista previa</button>
      </div>
    </form>
    <div id="connect-account" hidden>
      <button class="secondary" disabled>Alpaca Paper · pendiente</button>
    </div>
    <p id="investing-status" role="status" class="muted"></p>
    <div id="preview-metrics"></div>
    <div id="investing-preview" class="table-scroll" tabindex="0" role="region" aria-label="Vista previa de Investing.com"></div>
    <div class="holdings-controls dialog-actions">
      <button id="cancel-import" class="secondary" type="button">Cancelar</button>
      <button id="confirm-investing" type="button" hidden>Importar</button>
    </div>
  </dialog>
  <section class="card"><h2>Perfil del inversor</h2><div id="profile"></div></section>
  <section id="report-panel" class="card"><div class="pair"><h2>Informe</h2><span id="report-version" class="pill" hidden></span></div>
    <label id="report-picker" hidden>Informe guardado <select id="report-select"></select></label>
    <div id="report"><p class="muted">Aún no hay informe seleccionado.</p></div>
  </section>
</main>
<script>
const fmt = x => Number(x).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});
async function api(url, options){
 const response = await fetch(url, options);
 if(response.ok) return response.json();
 const data = await response.json().catch(()=>null);
 throw new Error(typeof data?.detail === 'string' ? data.detail : `HTTP ${response.status}`);
}
async function refresh(){
 const profile = await api('/api/profile');
 document.getElementById('profile').innerHTML=`<p><strong>${esc(profile.data.name)}</strong> · versión ${profile.version}</p><p>Horizonte: ${esc(profile.data.horizon)}</p><p>Riesgo: ${esc(profile.data.risk_tolerance)}</p><p class="muted small">${profile.data.constraints.map(esc).join(' · ')}</p>`;
}
function esc(x){return String(x ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function intelligenceSection(envelope){
 if(!envelope) return '<h3>Inteligencia</h3><p class="muted">Este informe anterior no incluye inteligencia.</p>';
 const x=envelope.result;
 const findings=x.findings.map(f=>`<li>${esc(f.statement)} <span class="small muted">(${esc(f.category)}; ${f.evidence.map(e=>esc(e.document_id)).join(', ')})</span></li>`).join('');
 const positions=x.proposed_positions.map(p=>`<li>${esc(p.instrument_id)}: ${esc(p.action)} — ${esc(p.rationale)}</li>`).join('');
 return `<h3>Inteligencia experimental</h3><p><span class="pill">${esc(x.decision)}</span> <span class="small muted">${esc(x.implementation)}${x.model ? ' · '+esc(x.model) : ''}</span></p>
 <p class="small muted">Salida ficticia para revisión; no es una orden ni una cartera objetivo.</p>
 <p><strong>Hallazgos</strong></p><ul>${findings || '<li>Sin hallazgos.</li>'}</ul>
 <p><strong>Posiciones para revisar</strong></p><ul>${positions || '<li>Ninguna.</li>'}</ul>
 <p><strong>Datos que faltan y avisos</strong></p><ul>${[...x.missing_data,...x.warnings].map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`;
}
async function showReport(id){
 const r=await api('/api/reports/'+encodeURIComponent(id));const d=r.result;
 if(d.kind === 'portfolio-test'){
  renderPortfolioReport(r);
  return;
 }
 const b=document.getElementById('report-version');b.hidden=false;b.textContent=`Cartera v${r.portfolio_version} · Perfil v${r.profile_version} · ${d.data_classification}`;
 document.getElementById('report').innerHTML=`<h3>Resultado determinista</h3><p><span class="pill">${esc(d.proposal)}</span> <strong>${esc(d.rationale)}</strong></p>
 <h3>Exposición identificada</h3>${d.exposures.map(e=>`<p><strong>${esc(e.issuer_id)}</strong>: ${fmt(e.known_total_eur)} EUR (${esc(e.known_share_pct ?? '?')} % de la cartera)<br><span class="small muted">Directa: ${fmt(e.direct_eur)} · Indirecta: ${fmt(e.indirect_eur)}</span></p>
 <ul>${e.matches.map(m=>`<li>${esc(m.kind)} · ${esc(m.position_id)} · ${fmt(m.value_eur)} EUR · ${esc(m.trace)}</li>`).join('')}</ul>
 ${e.coverage_warnings.map(c=>`<p class="small muted">⚠️ ${esc(c.position_id)}: composición no observada ${esc(c.uncovered_weight_pct)} %</p>`).join('')}
 <p class="small muted">${esc(e.coverage_note)}</p>`).join('')}
 <h3>Evidencia</h3><ul>${d.evidence.map(ev=>`<li><strong>${esc(ev.document_id)}</strong>: ${esc(ev.title)}<div class="small muted">${esc(ev.source_name)} · ${esc(ev.source_kind)} · publicado ${esc(ev.published_at)}</div></li>`).join('')}</ul>
 <h3>Limitaciones y argumentos</h3><ul>${[...d.arguments_against,...d.risks,...d.missing_data,...d.warnings].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 ${intelligenceSection(d.intelligence)}<p class="small muted">Informe congelado; los cambios posteriores de cartera/perfil no lo modificarán.</p>`;
}
</script>
<script src="/assets/holdings.js"></script>
</body>
</html>
