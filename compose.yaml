services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /data/portfolio.sqlite3
    volumes:
      - demo_data:/data
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DB_PATH: /data/portfolio.sqlite3
    volumes:
      - demo_data:/data
volumes:
  demo_data:
